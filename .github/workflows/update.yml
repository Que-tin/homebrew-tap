name: Update Gloam

# Checks a few times a day for a new Gloam release and moves the cask to it (version and the disk
# image's checksum), so installs and `brew upgrade` follow releases with nobody editing this file.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the cask to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo Que-tin/gloam --json tagName --jq .tagName)"
          version="${tag#v}"
          sha="$(curl -sSfL "https://github.com/Que-tin/gloam/releases/download/$tag/Gloam.dmg" | sha256sum | cut -d' ' -f1)"
          sed -i "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/gloam.rb
          if git diff --quiet; then echo "Already at $version"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "gloam $version"
          git push
